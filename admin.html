<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vizuka Admin</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="index.html"><b>V</b> VIZUKA <span>ADMIN</span></a><a class="admin" href="index.html">View Store</a></header>
<main><div id="login"><small>SECURE ADMIN</small><h1>Admin Login</h1><p>Sign in with the admin account created in Supabase Auth.</p><form id="loginForm" class="admin-form"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="btn full">Sign In</button></form><p id="loginError" class="error"></p></div>
<div id="dashboard" class="hidden"><div class="admin-head"><div><small>ADMIN DASHBOARD</small><h1>Vizuka Control Center</h1><p id="who"></p></div><button id="logout" class="btn">Log out</button></div><section class="stats"><div><small>Orders</small><strong id="sOrders">0</strong></div><div><small>Pending</small><strong id="sPending">0</strong></div><div><small>Products</small><strong id="sProducts">0</strong></div></section>
<section><div class="section-title"><h2>Products</h2><button id="refresh" class="btn">Refresh</button></div><div id="productsAdmin" class="grid"></div></section>
<section><div class="section-title"><h2>Orders</h2></div><div id="orders" class="orders"></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const cfg=window.VIZUKA_CONFIG||{};const configured=cfg.SUPABASE_URL&&!cfg.SUPABASE_URL.includes('https://tqikvafklxcrnqcvhyoz.supabase.com_')&&cfg.SUPABASE_PUBLISHABLE_KEY&&!cfg.SUPABASE_PUBLISHABLE_KEY.includes('sb_publishable_9uCJE7GZOvxi0Cp8H3-A7g_k9fCo_CF_');const sb=configured?window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY):null;const login=document.querySelector('#login'),dash=document.querySelector('#dashboard');
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const money=n=>`Rs. ${Number(n).toLocaleString('en-IN')}`;
async function boot(){if(!sb){document.querySelector('#loginError').textContent='Add your Supabase URL and publishable key to config.js first.';return}const {data:{session}}=await sb.auth.getSession();if(session)enter();}async function enter(){const {data:{user}}=await sb.auth.getUser();if(!user)return;const {data:profile,error}=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();if(error||!profile||profile.role!=='admin'){await sb.auth.signOut();document.querySelector('#loginError').textContent='This account is not authorized as an admin.';return}login.classList.add('hidden');dash.classList.remove('hidden');document.querySelector('#who').textContent=user.email;loadAll()}
document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();if(!sb)return;const {error}=await sb.auth.signInWithPassword({email:document.querySelector('#email').value.trim(),password:document.querySelector('#password').value});if(error)document.querySelector('#loginError').textContent=error.message;else enter()};document.querySelector('#logout').onclick=async()=>{await sb.auth.signOut();location.reload()};document.querySelector('#refresh').onclick=loadAll;
async function loadAll(){const [{data:ps,error:pe},{data:os,error:oe}]=await Promise.all([sb.from('products').select('*').order('sort_order',{ascending:true}),sb.from('orders').select('*').order('created_at',{ascending:false}).limit(100)]);if(pe||oe)return alert('Could not load dashboard data.');document.querySelector('#sProducts').textContent=ps.length;document.querySelector('#sOrders').textContent=os.length;document.querySelector('#sPending').textContent=os.filter(o=>['Pending Payment','Payment Verified','Processing'].includes(o.status)).length;document.querySelector('#productsAdmin').innerHTML=ps.map(p=>`<article class="card"><span class="cat">${esc(p.category)}</span><h3>${esc(p.name)}</h3><label>Price (Rs.)<input id="price-${p.id}" type="number" min="0" step="1" value="${p.price}"></label><button class="btn full" onclick="savePrice('${p.id}')">Save Price</button><button class="btn full ${p.available?'':'off'}" onclick="toggleProduct('${p.id}',${!p.available})">${p.available?'🟢 AVAILABLE':'🔴 UNAVAILABLE'}</button></article>`).join('');document.querySelector('#orders').innerHTML=os.map(o=>`<article class="order"><div><b>${esc(o.order_id)}</b><span>${esc(o.product_name)} • ${money(o.amount)}</span><span>UID: ${esc(o.player_uid)} • ${esc(o.payment_method)}</span><span>${new Date(o.created_at).toLocaleString()}</span></div><select onchange="updateStatus('${o.id}',this.value)">${['Pending Payment','Payment Verified','Processing','Completed','Failed/Cancelled'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></article>`).join('')||'<p>No orders yet.</p>'}
window.savePrice=async id=>{const n=Number(document.querySelector('#price-'+id).value);if(!Number.isFinite(n)||n<0)return alert('Enter a valid price.');const {error}=await sb.from('products').update({price:n,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else loadAll()};window.toggleProduct=async(id,value)=>{const {error}=await sb.from('products').update({available:value,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else loadAll()};window.updateStatus=async(id,status)=>{const {error}=await sb.from('orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else loadAll()};boot();
</script></body></html>
