<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vizuka Admin</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="index.html"><b>V</b> VIZUKA <span>ADMIN</span></a><a class="admin" href="index.html">View Store</a></header>
<main><small style="color:#b99cff">ADMIN PANEL • DEMO</small><h1>Product Management</h1><p style="color:#aaa2b7">Change prices and switch products ON/OFF. This prototype stores changes in this browser. A real shared secure backend comes next.</p>
<div id="grid" class="grid" style="margin-top:25px"></div></main>
<script>
const KEY="vizuka_products_v2";const DEFAULT=[{"id": "p1", "name": "50 💎", "category": "Diamonds", "price": 70, "available": true}, {"id": "p2", "name": "115 💎", "category": "Diamonds", "price": 120, "available": true}, {"id": "p3", "name": "240 💎", "category": "Diamonds", "price": 250, "available": true}, {"id": "p4", "name": "610 💎", "category": "Diamonds", "price": 550, "available": true}, {"id": "p5", "name": "Level Up Pass — Level 6", "category": "Level Up Pass", "price": 75, "available": true}, {"id": "p6", "name": "Level Up Pass — Level 10", "category": "Level Up Pass", "price": 130, "available": true}, {"id": "p7", "name": "Level Up Pass — Level 15", "category": "Level Up Pass", "price": 130, "available": true}, {"id": "p8", "name": "Level Up Pass — Level 20", "category": "Level Up Pass", "price": 130, "available": true}, {"id": "p9", "name": "Level Up Pass — Level 25", "category": "Level Up Pass", "price": 130, "available": true}, {"id": "p10", "name": "Level Up Pass — Level 30", "category": "Level Up Pass", "price": 170, "available": true}, {"id": "p11", "name": "Level Up Pass — All Levels", "category": "Level Up Pass", "price": 650, "available": true}, {"id": "p12", "name": "Weekly Lite", "category": "Memberships", "price": 100, "available": true}, {"id": "p13", "name": "Weekly", "category": "Memberships", "price": 230, "available": true}, {"id": "p14", "name": "Monthly", "category": "Memberships", "price": 1150, "available": true}, {"id": "p15", "name": "Weekly + Monthly", "category": "Combo", "price": 1350, "available": true}, {"id": "p16", "name": "Weekly + Monthly + Weekly Lite", "category": "Combo", "price": 1450, "available": true}];let products=JSON.parse(localStorage.getItem(KEY)||"null")||DEFAULT;
function save(){localStorage.setItem(KEY,JSON.stringify(products))}
function render(){document.querySelector("#grid").innerHTML=products.map((p,i)=>`<article class="card"><span class="cat">${p.category}</span><h3>${p.name}</h3><label style="color:#aaa;font-size:13px">Price (Rs.)<input id="v${i}" value="${p.price}" style="width:100%;margin-top:7px;padding:11px;border-radius:9px;border:1px solid #352a40;background:#0b0810;color:#fff"></label><button class="btn full ${p.available?"":"off"}" style="margin-top:10px" onclick="toggle(${i})">${p.available?"🟢 AVAILABLE":"🔴 UNAVAILABLE"}</button><button class="btn full" style="margin-top:8px" onclick="price(${i})">Save Price</button></article>`).join("")}
function toggle(i){products[i].available=!products[i].available;save();render()}function price(i){let n=Number(document.querySelector("#v"+i).value);if(!Number.isFinite(n)||n<0)return alert("Enter a valid price.");products[i].price=n;save();render();alert("Price saved.")}render();
</script></body></html>
